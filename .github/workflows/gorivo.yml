name: Gorivo Digest

on:
  schedule:
    - cron: '0 15 * * 5'
  workflow_dispatch: {}

jobs:
  post-gorivo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install feedparser requests google-genai

      - run: python news_bot.py
        env:
          GORIVO_DISCORD_WEBHOOK_URL: ${{secrets.GORIVO_DISCORD_WEBHOOK_URL}}
          GEMINI_API_KEY: ${{secrets.GEMINI_API_KEY}}
          RUN_GORIVO_ONLY: 'true'
